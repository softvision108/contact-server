# Static landing for itstaff.io. Port 80 serves the page too (no https redirect, as requested).
server {
    listen 80;
    listen [::]:80;
    server_name itstaff.io www.itstaff.io;
    include snippets/skystake-acme.conf;

    root /var/www/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|webp|jpg|jpeg|svg|ico|css|js|woff2?)$ {
        expires 7d;
        access_log off;
    }
}

# HTTPS (cert by certbot webroot, covers itstaff.io and www).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name itstaff.io www.itstaff.io;
    ssl_certificate /etc/letsencrypt/live/itstaff.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itstaff.io/privkey.pem;
    include snippets/skystake-ssl.conf;
    include snippets/skystake-acme.conf;

    root /var/www/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|webp|jpg|jpeg|svg|ico|css|js|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
