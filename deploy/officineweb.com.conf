# officineweb.com: same static landing as itstaff.io. Port 80 serves the page too (no https redirect).
server {
    listen 80;
    listen [::]:80;
    server_name officineweb.com www.officineweb.com;
    include snippets/skystake-acme.conf;

    root /var/www/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|webp|jpg|jpeg|svg|ico|css|js|woff2?)$ {
        expires 7d;
        access_log off;
    }
}

# HTTPS (cert by certbot webroot, covers officineweb.com and www).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name officineweb.com www.officineweb.com;
    ssl_certificate /etc/letsencrypt/live/officineweb.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/officineweb.com/privkey.pem;
    include snippets/skystake-ssl.conf;
    include snippets/skystake-acme.conf;

    root /var/www/landing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|webp|jpg|jpeg|svg|ico|css|js|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
